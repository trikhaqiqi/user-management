apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      # Makes request_id in a log line clickable: shows every line (gateway
      # and service) that belongs to the same request.
      derivedFields:
        - name: request_id
          matcherRegex: '"request_id":"([^"]+)"'
          url: '{service=~".+"} |= "$${__value.raw}"'
          datasourceUid: loki
